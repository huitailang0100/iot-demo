<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IoT历史数据可视化</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a2a6c, #2c3e50);
      color: #fff;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
      padding: 20px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 15px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
      background: linear-gradient(to right, #4facfe, #00f2fe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 1.2rem;
      opacity: 0.9;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.1);
      padding: 10px 15px;
      border-radius: 25px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    label {
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    select, input {
      padding: 8px 12px;
      border-radius: 20px;
      border: none;
      background: rgba(255, 255, 255, 0.9);
      color: #333;
      font-weight: 500;
    }

    button {
      padding: 12px 25px;
      border: none;
      border-radius: 25px;
      background: linear-gradient(to right, #3498db, #8e44ad);
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
    }

    #refresh-btn {
      background: linear-gradient(to right, #2ecc71, #27ae60);
    }

    #reset-btn {
      background: linear-gradient(to right, #e74c3c, #c0392b);
    }

    .chart-container {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 30px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .chart-title {
      text-align: center;
      font-size: 1.5rem;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    #chart {
      width: 100%;
      height: 500px;
    }

    .stats-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 15px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: transform 0.3s ease;
    }

    .stat-card:hover {
      transform: translateY(-5px);
    }

    .stat-icon {
      font-size: 2rem;
      margin-bottom: 10px;
    }

    .stat-title {
      font-size: 1.2rem;
      margin-bottom: 15px;
      opacity: 0.8;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .stat-value {
      font-size: 2rem;
      font-weight: bold;
    }

    .temperature-value {
      color: #ff5252;
    }

    .humidity-value {
      color: #4fc3f7;
    }

    .data-table-container {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 30px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      overflow-x: auto;
    }

    .table-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .table-title {
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 12px 15px;
      text-align: left;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    th {
      background: rgba(255, 255, 255, 0.2);
      font-weight: bold;
    }

    tr:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .export-btn {
      padding: 8px 15px;
      background: linear-gradient(to right, #9b59b6, #8e44ad);
      border-radius: 20px;
      border: none;
      color: white;
      cursor: pointer;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    footer {
      text-align: center;
      padding: 20px;
      opacity: 0.7;
      font-size: 0.9rem;
    }

    .loading {
      text-align: center;
      padding: 20px;
      font-style: italic;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.2);
      padding: 10px 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 0.9rem;
    }

    .status-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    @media (max-width: 768px) {
      .controls {
        flex-direction: column;
        align-items: center;
      }
      
      .control-group {
        width: 100%;
        justify-content: space-between;
      }
      
      h1 {
        font-size: 2rem;
      }
      
      .stats-container {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 480px) {
      .stats-container {
        grid-template-columns: 1fr;
      }
      
      .status-bar {
        flex-direction: column;
        gap: 5px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1><i class="fas fa-chart-line"></i> IoT历史数据可视化</h1>
      <p class="subtitle">基于SQLite数据库的历史数据展示与分析</p>
    </header>

    <div class="status-bar">
      <div class="status-item">
        <i class="fas fa-database"></i>
        <span>数据库状态: <span id="db-status">连接正常</span></span>
      </div>
      <div class="status-item">
        <i class="fas fa-sync-alt"></i>
        <span>最后更新: <span id="last-update">-</span></span>
      </div>
      <div class="status-item">
        <i class="fas fa-microchip"></i>
        <span>数据总量: <span id="total-records">0</span> 条</span>
      </div>
    </div>

    <div class="controls">
      <div class="control-group">
        <label for="device-selector"><i class="fas fa-microchip"></i> 设备:</label>
        <select id="device-selector">
          <option value="">所有设备</option>
        </select>
      </div>
      
      <div class="control-group">
        <label for="data-limit"><i class="fas fa-list-ol"></i> 数据点数量:</label>
        <select id="data-limit">
          <option value="50">50</option>
          <option value="100" selected>100</option>
          <option value="200">200</option>
          <option value="500">500</option>
        </select>
      </div>
      
      <button id="refresh-btn"><i class="fas fa-sync-alt"></i> 刷新数据</button>
      <button id="reset-btn"><i class="fas fa-redo"></i> 重置视图</button>
    </div>

    <div class="stats-container">
      <div class="stat-card">
        <div class="stat-icon"><i class="fas fa-thermometer-half temperature-value"></i></div>
        <div class="stat-title"><i class="fas fa-arrow-up temperature-value"></i> 最高温度</div>
        <div class="stat-value temperature-value" id="max-temperature">--</div>
      </div>
      
      <div class="stat-card">
        <div class="stat-icon"><i class="fas fa-thermometer-quarter temperature-value"></i></div>
        <div class="stat-title"><i class="fas fa-arrow-down temperature-value"></i> 最低温度</div>
        <div class="stat-value temperature-value" id="min-temperature">--</div>
      </div>
      
      <div class="stat-card">
        <div class="stat-icon"><i class="fas fa-thermometer-full temperature-value"></i></div>
        <div class="stat-title"><i class="fas fa-divide temperature-value"></i> 平均温度</div>
        <div class="stat-value temperature-value" id="avg-temperature">--</div>
      </div>
      
      <div class="stat-card">
        <div class="stat-icon"><i class="fas fa-tint humidity-value"></i></div>
        <div class="stat-title"><i class="fas fa-arrow-up humidity-value"></i> 最高湿度</div>
        <div class="stat-value humidity-value" id="max-humidity">--</div>
      </div>
      
      <div class="stat-card">
        <div class="stat-icon"><i class="fas fa-tint-slash humidity-value"></i></div>
        <div class="stat-title"><i class="fas fa-arrow-down humidity-value"></i> 最低湿度</div>
        <div class="stat-value humidity-value" id="min-humidity">--</div>
      </div>
      
      <div class="stat-card">
        <div class="stat-icon"><i class="fas fa-tint humidity-value"></i></div>
        <div class="stat-title"><i class="fas fa-divide humidity-value"></i> 平均湿度</div>
        <div class="stat-value humidity-value" id="avg-humidity">--</div>
      </div>
    </div>

    <div class="chart-container">
      <div class="chart-title"><i class="fas fa-chart-line"></i> 历史数据趋势图</div>
      <canvas id="chart"></canvas>
    </div>

    <div class="data-table-container">
      <div class="table-header">
        <h2 class="table-title"><i class="fas fa-table"></i> 详细数据表</h2>
        <button class="export-btn" id="export-btn"><i class="fas fa-download"></i> 导出CSV</button>
      </div>
      <table id="data-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>设备ID</th>
            <th>时间戳</th>
            <th>温度 (°C)</th>
            <th>湿度 (%)</th>
          </tr>
        </thead>
        <tbody>
          <!-- 数据将通过JavaScript填充 -->
        </tbody>
      </table>
      <div id="loading-message" class="loading">加载中...</div>
    </div>

    <footer>
      <p>IoT历史数据可视化系统 &copy; 2023 | 基于SQLite数据库</p>
    </footer>
  </div>

  <script>
    // 元素获取
    const deviceSelector = document.getElementById('device-selector');
    const dataLimit = document.getElementById('data-limit');
    const refreshBtn = document.getElementById('refresh-btn');
    const resetBtn = document.getElementById('reset-btn');
    const exportBtn = document.getElementById('export-btn');
    const dataTable = document.getElementById('data-table').querySelector('tbody');
    const loadingMessage = document.getElementById('loading-message');
    const lastUpdateElement = document.getElementById('last-update');
    const totalRecordsElement = document.getElementById('total-records');
    
    // 统计元素
    const maxTemperatureElement = document.getElementById('max-temperature');
    const minTemperatureElement = document.getElementById('min-temperature');
    const avgTemperatureElement = document.getElementById('avg-temperature');
    const maxHumidityElement = document.getElementById('max-humidity');
    const minHumidityElement = document.getElementById('min-humidity');
    const avgHumidityElement = document.getElementById('avg-humidity');
    
    // Chart.js 图表
    const ctx = document.getElementById('chart').getContext('2d');
    let chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: [],
        datasets: [
          {
            label: '温度 (°C)',
            data: [],
            borderColor: '#ff5252',
            backgroundColor: 'rgba(255, 82, 82, 0.1)',
            borderWidth: 2,
            fill: false,
            yAxisID: 'y',
            tension: 0.2
          },
          {
            label: '湿度 (%)',
            data: [],
            borderColor: '#4fc3f7',
            backgroundColor: 'rgba(79, 195, 247, 0.1)',
            borderWidth: 2,
            fill: false,
            yAxisID: 'y1',
            tension: 0.2
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            labels: {
              color: '#fff',
              font: {
                size: 14
              }
            }
          },
          tooltip: {
            backgroundColor: 'rgba(0, 0, 0, 0.7)',
            titleColor: '#fff',
            bodyColor: '#fff',
            borderColor: 'rgba(255, 255, 255, 0.1)',
            borderWidth: 1
          }
        },
        scales: {
          x: {
            title: {
              display: true,
              text: '时间',
              color: '#fff'
            },
            grid: {
              color: 'rgba(255, 255, 255, 0.1)'
            },
            ticks: {
              color: '#fff'
            }
          },
          y: {
            type: 'linear',
            display: true,
            position: 'left',
            title: {
              display: true,
              text: '温度 (°C)',
              color: '#fff'
            },
            grid: {
              color: 'rgba(255, 255, 255, 0.1)'
            },
            ticks: {
              color: '#fff'
            },
            // 将纵轴长度减少3倍
            min: -10,
            max: 40
          },
          y1: {
            type: 'linear',
            display: true,
            position: 'right',
            title: {
              display: true,
              text: '湿度 (%)',
              color: '#fff'
            },
            grid: {
              drawOnChartArea: false,
            },
            ticks: {
              color: '#fff'
            },
            // 将纵轴长度减少3倍
            min: 0,
            max: 100
          }
        }
      }
    });
    
    // 页面加载时获取数据
    window.addEventListener('load', function() {
      loadDeviceList();
      loadData();
    });
    
    // 刷新按钮事件
    refreshBtn.addEventListener('click', loadData);
    
    // 重置按钮事件
    resetBtn.addEventListener('click', function() {
      deviceSelector.value = '';
      dataLimit.value = '100';
      loadData();
    });
    
    // 导出按钮事件
    exportBtn.addEventListener('click', exportToCSV);
    
    // 设备选择器和数据限制变化时重新加载数据
    deviceSelector.addEventListener('change', loadData);
    dataLimit.addEventListener('change', loadData);
    
    // 加载设备列表
    function loadDeviceList() {
      fetch('/api/history?limit=1000')
        .then(response => response.json())
        .then(data => {
          const devices = [...new Set(data.map(item => item.device_id).filter(Boolean))];
          deviceSelector.innerHTML = '<option value="">所有设备</option>';
          devices.forEach(device => {
            const option = document.createElement('option');
            option.value = device;
            option.textContent = device;
            deviceSelector.appendChild(option);
          });
        })
        .catch(error => {
          console.error('Error loading device list:', error);
        });
    }
    
    // 加载数据
    function loadData() {
      loadingMessage.style.display = 'block';
      dataTable.innerHTML = '';
      
      const deviceId = deviceSelector.value;
      const limit = dataLimit.value;
      
      let url = `/api/history?limit=${limit}`;
      if (deviceId) {
        url += `&deviceId=${deviceId}`;
      }
      
      fetch(url)
        .then(response => response.json())
        .then(data => {
          // 更新状态栏
          totalRecordsElement.textContent = data.length;
          lastUpdateElement.textContent = new Date().toLocaleString('zh-CN');
          
          // 反转数据以按时间顺序显示
          data.reverse();
          
          // 更新表格
          updateTable(data);
          
          // 更新图表
          updateChart(data);
          
          // 更新统计信息
          updateStats(data);
          
          loadingMessage.style.display = 'none';
        })
        .catch(error => {
          console.error('Error loading data:', error);
          loadingMessage.textContent = '加载数据失败';
        });
    }
    
    // 更新表格
    function updateTable(data) {
      dataTable.innerHTML = '';
      
      data.forEach(item => {
        const row = document.createElement('tr');
        
        const date = new Date(item.timestamp);
        const formattedDate = date.toLocaleString('zh-CN');
        
        row.innerHTML = `
          <td>${item.id}</td>
          <td>${item.device_id || 'N/A'}</td>
          <td>${formattedDate}</td>
          <td>${item.temperature !== null ? item.temperature.toFixed(2) : 'N/A'}</td>
          <td>${item.humidity !== null ? item.humidity.toFixed(2) : 'N/A'}</td>
        `;
        
        dataTable.appendChild(row);
      });
    }
    
    // 更新图表
    function updateChart(data) {
      const labels = data.map(item => {
        const date = new Date(item.timestamp);
        return `${date.getHours().toString().padStart(2, '0')}:${date.getMinutes().toString().padStart(2, '0')}:${date.getSeconds().toString().padStart(2, '0')}`;
      });
      
      const temperatures = data.map(item => item.temperature);
      const humidities = data.map(item => item.humidity);
      
      chart.data.labels = labels;
      chart.data.datasets[0].data = temperatures;
      chart.data.datasets[1].data = humidities;
      chart.update();
    }
    
    // 更新统计信息
    function updateStats(data) {
      if (data.length === 0) {
        maxTemperatureElement.textContent = '--';
        minTemperatureElement.textContent = '--';
        avgTemperatureElement.textContent = '--';
        maxHumidityElement.textContent = '--';
        minHumidityElement.textContent = '--';
        avgHumidityElement.textContent = '--';
        return;
      }
      
      // 温度统计
      const temperatures = data
        .map(item => item.temperature)
        .filter(temp => temp !== null);
        
      if (temperatures.length > 0) {
        const maxTemp = Math.max(...temperatures);
        const minTemp = Math.min(...temperatures);
        const avgTemp = temperatures.reduce((sum, temp) => sum + temp, 0) / temperatures.length;
        
        maxTemperatureElement.textContent = maxTemp.toFixed(2);
        minTemperatureElement.textContent = minTemp.toFixed(2);
        avgTemperatureElement.textContent = avgTemp.toFixed(2);
      } else {
        maxTemperatureElement.textContent = '--';
        minTemperatureElement.textContent = '--';
        avgTemperatureElement.textContent = '--';
      }
      
      // 湿度统计
      const humidities = data
        .map(item => item.humidity)
        .filter(humidity => humidity !== null);
        
      if (humidities.length > 0) {
        const maxHumidity = Math.max(...humidities);
        const minHumidity = Math.min(...humidities);
        const avgHumidity = humidities.reduce((sum, humidity) => sum + humidity, 0) / humidities.length;
        
        maxHumidityElement.textContent = maxHumidity.toFixed(2);
        minHumidityElement.textContent = minHumidity.toFixed(2);
        avgHumidityElement.textContent = avgHumidity.toFixed(2);
      } else {
        maxHumidityElement.textContent = '--';
        minHumidityElement.textContent = '--';
        avgHumidityElement.textContent = '--';
      }
    }
    
    // 导出为CSV
    function exportToCSV() {
      const deviceId = deviceSelector.value;
      const limit = dataLimit.value;
      
      let url = `/api/history?limit=${limit}`;
      if (deviceId) {
        url += `&deviceId=${deviceId}`;
      }
      
      fetch(url)
        .then(response => response.json())
        .then(data => {
          // 准备CSV内容
          let csvContent = '\uFEFF'; // BOM for UTF-8
          csvContent += 'ID,设备ID,时间戳,温度(°C),湿度(%)\n';
          
          data.forEach(item => {
            const date = new Date(item.timestamp);
            const formattedDate = date.toLocaleString('zh-CN');
            csvContent += `${item.id},${item.device_id || 'N/A'},${formattedDate},${item.temperature !== null ? item.temperature.toFixed(2) : 'N/A'},${item.humidity !== null ? item.humidity.toFixed(2) : 'N/A'}\n`;
          });
          
          // 创建下载链接
          const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          const fileName = `iot_data_${new Date().toISOString().slice(0, 19).replace(/:/g, '-')}.csv`;
          
          link.setAttribute('href', url);
          link.setAttribute('download', fileName);
          link.style.visibility = 'hidden';
          
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
        })
        .catch(error => {
          console.error('导出CSV失败:', error);
          alert('导出CSV失败，请稍后重试');
        });
    }
  </script>
</body>
</html>
